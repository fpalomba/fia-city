<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>FIA City</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23e4572e%22/%3E%3Ctext x=%228%22 y=%2212%22 font-size=%2210%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22monospace%22%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#e4572e">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="chip"><b id="hud-user"></b></div>
    <div class="chip area" id="hud-area"></div>
    <div class="spacer"></div>
    <div class="chip" title="Badge ottenuti">🏅 <span id="hud-badges">0/0</span></div>
    <button class="chip" id="hud-pet" title="Parla con il tuo compagno (C)">🐾</button>
    <button class="chip" id="hud-audio" title="Audio on/off (M)">🔊</button>
    <button class="chip" id="hud-menu" title="Zaino (ESC)">🎒 Zaino</button>
  </div>

  <div id="login">
    <div class="panel">
      <div class="logo">FIA CITY</div>
      <div class="subtitle">Fondamenti di Intelligenza Artificiale<br>il serious game del corso</div>
      <form id="login-form" autocomplete="off">
        <label for="username">Scegli il tuo username (lo stesso ogni volta!)</label>
        <input id="username" maxlength="32" placeholder="es. m.rossi o la tua matricola" autofocus>
        <div class="error" id="login-error"></div>
        <button class="btn primary" type="submit">▶ Entra in città</button>
      </form>
      <p class="muted" style="font-size:15px;margin-bottom:0">Non serve password: i tuoi progressi sono salvati sul tuo username.</p>
    </div>
  </div>

  <div id="dialog" class="hidden">
    <div class="choices"></div>
    <div class="panel"><div class="name hidden"></div><div class="text"></div><div class="next hidden">▼</div></div>
  </div>

  <div id="hint" class="hidden"><div class="panel"></div></div>
  <div id="pet-bubble" class="hidden"><div class="panel"></div></div>

  <div id="screen" class="hidden"><div class="wrap"></div></div>
  <div id="boss" class="hidden"></div>
  <div id="toast" class="hidden"><div class="panel"></div></div>

  <div id="touch">
    <div class="dpad">
      <button class="u" data-dir="up">▲</button><button class="l" data-dir="left">◀</button>
      <button class="r" data-dir="right">▶</button><button class="d" data-dir="down">▼</button>
    </div>
    <div class="ab"><button class="c" data-key="c" title="Compagno">🐾</button><button class="b" data-key="b">B</button><button class="a" data-key="a">A</button></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
